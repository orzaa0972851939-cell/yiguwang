name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 2 * * 1,4'
  workflow_dispatch:  
jobs:  
  ping:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Check DNS resolution
        run: |        
          echo "Supabase URL: jdagwfgherzpqogsmlkc.supabase.co"
          echo "--- nslookup ---"
          nslookup jdagwfgherzpqogsmlkc.supabase.co || echo "nslookup failed"
          echo "--- dig ---"
          dig +short jdagwfgherzpqogsmlkc.supabase.co || echo "dig failed"
          echo "--- host ---"
          host jdagwfgherzpqogsmlkc.supabase.co || echo "host failed"
          echo "--- curl debug ---"
      - name: Ping Supabase Keep-Alive
        run: |        
          echo "Sending request to keep-alive edge function..."
          RESPONSE=$(curl -sS -X POST \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            --connect-timeout 10 \
            https://jdagwfgherzpqogsmlkc.supabase.co/functions/v1/keep-alive \
            -H "Content-Type: application/json" \
            -w "\nHTTP_CODE:%{http_code}" \
            -v 2>&1)
          echo "Full Response:"
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q "HTTP_CODE:200"; then
            echo "Keep-alive succeeded!"
          else
            echo "Keep-alive failed!"
            exit 1
          fi
